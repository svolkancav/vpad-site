# Cloudflare Workers — static assets deployment for vpadcontroller.com.
#
# The site is plain files, so no Worker script is needed: Workers serves the
# directory directly and Cloudflare handles TLS and the CDN. Deploy with
#   wrangler deploy
# or let CI do it (.github/workflows/deploy.yml).
#
# The site lives in docs/ — an ALLOWLIST by construction. Pointing assets at
# the repo root failed: `wrangler-action` installs wrangler into ./node_modules
# inside the checkout, so the 122 MiB `workerd` binary became an "asset" and
# tripped the 25 MiB per-file limit. An .assetsignore blocklist would have
# patched that one case and stayed leaky for the next tool that writes to the
# root. docs/ is also a directory GitHub Pages can serve, so the fallback URL
# keeps working from the same files.

name = "vpadcontroller"
compatibility_date = "2026-08-01"

# Declaring the custom domains here means `wrangler deploy` attaches them and
# writes the DNS records itself — no dashboard clicking, and the mapping is
# reviewable in git. It also REPLACES whatever the records point at today
# (the registrar's parked page), which is the intended effect.
routes = [
  { pattern = "vpadcontroller.com", custom_domain = true },
  { pattern = "www.vpadcontroller.com", custom_domain = true },
]

[assets]
directory = "./docs"
# A missing path serves 404.html instead of a bare Workers error page.
not_found_handling = "404-page"
